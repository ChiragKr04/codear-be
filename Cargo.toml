[package]
name = "codear"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
ignore = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "agentcli"
path = "src/main.rs"
